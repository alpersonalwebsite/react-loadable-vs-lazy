version: 2.1

jobs:
  build:
    docker:
      # Pinned. `node:lts` floats, so the image changed under a project frozen on
      # Create React App 3 every time a new LTS shipped. Create React App 3 also needs
      # a Node below 17: webpack 4 asks OpenSSL for MD4, which fails on 17+ with
      # ERR_OSSL_EVP_UNSUPPORTED.
      - image: cimg/node:12.22
    steps:
      - checkout
      # npm ci, not npm install: exactly what package-lock.json pins.
      - run: npm ci
      # This repo had no lint script at all, alone among its siblings.
      - run: npm run lint
      - run:
          name: Test
          command: npm test -- --watchAll=false
      # CI deliberately NOT set to false: Create React App treats warnings as errors
      # when it is set, and the three "'React' is defined but never used" warnings that
      # setting hid are exactly the sort of thing this catches.
      - run: npm run build
